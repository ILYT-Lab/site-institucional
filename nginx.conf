# Nginx do site ILYT. Obs.: add_header dentro de um location substitui os do nível de cima,
# por isso os cabeçalhos de segurança ficam em security-headers.conf e são incluídos em cada bloco.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  # redirecionamentos com endereço relativo (atrás do proxy do Coolify o nginx não sabe que é https)
  absolute_redirect off;

  # www.ilyt.com.br → ilyt.com.br (um domínio só, como o canonical)
  if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

  # arquivos com hash no nome (CSS, JS, imagens otimizadas, fontes): cache de 1 ano
  location /_astro/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|svg|webmanifest)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # um endereço por página (o mesmo do canonical e do sitemap): /index.html → /, /pagina.html → /pagina
  location = /index.html {
    if ($request_uri ~ ^/index\.html) { return 301 /; }
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  location ~ ^/(.+)\.html$ {
    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) { return 301 /$1$2; }
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # páginas sem extensão na URL (/politica-de-privacidade → politica-de-privacidade.html)
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    rewrite ^/(.+)/$ /$1 permanent;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
