<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:1000px;overflow:hidden}
body{background:#101012;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(45% 55% at 50% 60%,var(--acc),transparent 70%);opacity:.3}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.ph{position:absolute;top:170px;width:340px;height:709px;padding:10px;background:#0c0c0e;border:1px solid #34343a;border-radius:54px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 2px #1f1f23}
.ph:nth-of-type(4){top:110px}
.ph .vp{width:320px;height:689px;overflow:hidden;border-radius:44px;position:relative;background:var(--sb,#fff)}
.ph .sb{height:42px;background:var(--sb,#fff);color:var(--sbc,#111);display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font:600 13px -apple-system,'Segoe UI',sans-serif}
.ph .sb i{font-style:normal;letter-spacing:1px}
.ph iframe{width:390px;height:788px;border:0;transform:scale(.8205);transform-origin:0 0}
.ph .isl{position:absolute;left:50%;top:10px;width:96px;height:27px;margin-left:-48px;background:#000;border-radius:20px;z-index:2}
</style></head>
<body>
<div class="glow"></div><div class="grid"></div>
<div class="ph" style="left:242px"><div class="vp"><span class="isl"></span><div class="sb"><span>9:41</span><i>●●● ▮</i></div><iframe></iframe></div></div>
<div class="ph" style="left:630px"><div class="vp"><span class="isl"></span><div class="sb"><span>9:41</span><i>●●● ▮</i></div><iframe></iframe></div></div>
<div class="ph" style="left:1018px"><div class="vp"><span class="isl"></span><div class="sb"><span>9:41</span><i>●●● ▮</i></div><iframe></iframe></div></div>
<script>
const q=new URLSearchParams(location.search);
['acc','sb','sbc'].forEach(k=>q.get(k)&&document.body.style.setProperty('--'+k,q.get(k)));
const f=document.querySelectorAll('iframe');['a','b','c'].forEach((k,i)=>f[i].src=q.get(k));
</script>
</body></html>
