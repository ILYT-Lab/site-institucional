<!-- @dsCard group="Conteúdo" height=300 subtitle="Conteúdo de exemplo: entra quando houver clientes reais" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.wrap{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-2)}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-piece);padding:var(--space-8);display:flex;flex-direction:column;gap:20px;min-width:0}
.res{font:500 28px/1.1 var(--font-display);letter-spacing:-.01em}
.res small{display:block;font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);margin-top:8px}
blockquote{margin:0;font-size:17px;line-height:1.6}
figcaption{display:flex;gap:12px;align-items:center;margin-top:auto}
.av{width:40px;height:40px;border-radius:12px;background:var(--surface-raised);display:grid;place-items:center;font:600 14px/1 var(--font-sans);color:var(--ink-muted)}
figcaption b{display:block;font-weight:600}
figcaption span{font-size:14px;color:var(--ink-muted)}
.ex{font:500 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);border:1px dashed var(--line-strong);border-radius:999px;padding:5px 9px;align-self:flex-start}
</style>
<div class="wrap">
  <figure><span class="ex">Exemplo</span><div class="res">3h por dia<small>a menos digitando pedidos</small></div><blockquote>"Antes eu passava a noite passando pedido do WhatsApp pra planilha. Hoje chega tudo organizado."</blockquote><figcaption><span class="av">NS</span><div><b>Nome Sobrenome</b><span>Dono, Empresa Exemplo</span></div></figcaption></figure>
  <figure><span class="ex">Exemplo</span><div class="res">2× mais contatos<small>no primeiro mês da nova página</small></div><blockquote>"O site antigo era só um cartão de visita. O novo virou o nosso melhor vendedor."</blockquote><figcaption><span class="av">NS</span><div><b>Nome Sobrenome</b><span>Sócia, Empresa Exemplo</span></div></figcaption></figure>
</div>
