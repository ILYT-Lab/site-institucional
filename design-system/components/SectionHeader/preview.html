<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.wrap{padding:32px 24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px 48px;align-items:end}
.eyebrow{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:500 12px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.eyebrow::before{content:"";width:24px;height:8px;border-radius:4px;background:var(--amber)}
h2{font:600 44px/1.05 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0;font-size:19px;line-height:1.6;color:var(--ink-muted);max-width:44ch}
@media (max-width:640px){.wrap{grid-template-columns:1fr}h2{font-size:30px}}
</style>
<header class="wrap">
  <div class="eyebrow">Como funciona / 4 etapas</div>
  <h2>Do primeiro café ao sistema no ar.</h2>
  <p>Você conta como a empresa funciona hoje. A gente desenha, constrói e acompanha até dar resultado.</p>
</header>
