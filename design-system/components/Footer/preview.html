<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
footer{margin:24px;border-top:1px solid var(--line);padding-top:40px;display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:32px}
.brand{display:flex;flex-direction:column;gap:16px}
.logo{display:block;width:120px;height:41px;overflow:hidden;position:relative}
.logo img{position:absolute;width:138px;max-width:none;left:-11px;top:-19px}
.v-dark{mix-blend-mode:screen}.v-light{display:none;mix-blend-mode:multiply}
[data-theme="light"] .v-dark{display:none}[data-theme="light"] .v-light{display:block}
.brand p{margin:0;color:var(--ink-muted);line-height:1.6;max-width:32ch}
h4{margin:0 0 14px;font:500 11px/1.4 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a{color:var(--ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:4px}
.copy{display:inline-flex;gap:8px;align-items:center;background:none;border:0;padding:0;color:var(--ink);font:400 16px/1.4 var(--font-sans);cursor:pointer}
.copy small{font:500 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);border:1px solid var(--line-strong);border-radius:999px;padding:4px 7px}
.base{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:20px;font-size:14px;color:var(--ink-muted)}
@media (max-width:720px){footer{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}}
</style>
<footer>
  <div class="brand">
    <span class="logo" role="img" aria-label="ILYT"><img class="v-dark" src="/_blob/7065e7fa46a1e9cdf4270d0d5cf4432f" alt=""><img class="v-light" src="/_blob/c571db795b59381b548942ccf0947c2a" alt=""></span>
    <p>Tecnologia sob medida para pequenas e médias empresas.</p>
  </div>
  <nav aria-label="Rodapé"><h4>Navegue</h4><ul><li><a href="#">Serviços</a></li><li><a href="#">Portfólio</a></li><li><a href="#">Sobre</a></li><li><a href="#">Contato</a></li></ul></nav>
  <div><h4>Fale com a gente</h4><ul><li><a href="#">WhatsApp</a></li><li><button class="copy" type="button" id="copy-mail">contato@ilyt.com.br <small>copiar</small></button></li></ul></div>
  <div><h4>Acompanhe</h4><ul><li><a href="#">Instagram @ilytdigital</a></li><li><a href="#">LinkedIn</a></li></ul></div>
  <div class="base"><span>© 2026 ILYT. Todos os direitos reservados.</span><span>CNPJ a definir · <a href="#">Política de privacidade</a></span></div>
</footer>
<script>
document.getElementById('copy-mail').addEventListener('click', e => {
  const b = e.currentTarget, s = b.querySelector('small');
  navigator.clipboard?.writeText('contato@ilyt.com.br').then(() => { s.textContent = 'copiado'; }, () => { s.textContent = 'selecione'; });
});
</script>
