<!-- @dsCard group="Feedback" height=300 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:24px;align-items:start}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demo button{font:600 14px/1 var(--font-sans);background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:12px 14px;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:var(--space-2)}
.toast{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-piece);padding:14px 14px 14px 16px}
.toast .ic{width:22px;height:22px;border-radius:999px;display:grid;place-items:center;font:600 13px/1 var(--font-sans);margin-top:1px}
.ok .ic{background:var(--success);color:var(--bg)}
.err .ic{background:var(--danger);color:var(--bg)}
.info .ic{background:var(--amber);color:var(--on-amber)}
.toast strong{display:block;font:600 15px/1.4 var(--font-sans)}
.toast span.t{display:block;font:400 14px/1.5 var(--font-sans);color:var(--ink-muted)}
.toast .x{background:none;border:0;color:var(--ink-muted);font:400 18px/1 var(--font-sans);cursor:pointer;padding:2px 4px;border-radius:6px}
.toast .x:hover{color:var(--ink)}
</style>
<div class="wrap">
  <div class="demo">
    <button type="button" data-k="ok">Simular envio</button>
    <button type="button" data-k="info">Copiar e-mail</button>
    <button type="button" data-k="err">Simular erro</button>
  </div>
  <div class="stack" id="stack" role="status" aria-live="polite">
    <div class="toast ok"><span class="ic">✓</span><div><strong>Mensagem recebida</strong><span class="t">A gente responde ainda hoje.</span></div><button class="x" type="button" aria-label="Fechar">×</button></div>
    <div class="toast info"><span class="ic">i</span><div><strong>E-mail copiado</strong><span class="t">contato@ilyt.com.br</span></div><button class="x" type="button" aria-label="Fechar">×</button></div>
    <div class="toast err"><span class="ic">!</span><div><strong>Não conseguimos enviar</strong><span class="t">Confira sua conexão e tente de novo, ou chame no WhatsApp.</span></div><button class="x" type="button" aria-label="Fechar">×</button></div>
  </div>
</div>
<script>
(() => {
  const stack = document.getElementById('stack');
  const tpl = { ok: stack.children[0], info: stack.children[1], err: stack.children[2] };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  stack.addEventListener('click', e => { if (e.target.closest('.x')) e.target.closest('.toast').remove(); });
  document.querySelectorAll('.demo button').forEach(b => b.addEventListener('click', () => {
    const t = tpl[b.dataset.k].cloneNode(true);
    stack.prepend(t);
    if (!reduce) t.animate([{ transform: 'translateY(-12px) rotate(-1.5deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 700, easing: 'cubic-bezier(0.2, 0.9, 0.2, 1.15)' });
    while (stack.children.length > 3) stack.lastElementChild.remove();
  }));
})();
</script>
