<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.wrap{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:720px}
.f{display:flex;flex-direction:column;gap:8px;min-width:0}
label{font:500 14px/1.4 var(--font-sans)}
input{font:400 16px/1.4 var(--font-sans);color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:14px}
input::placeholder{color:var(--ink-muted)}
input:focus{outline:2px solid var(--focus);outline-offset:2px}
.err input{border-color:var(--danger)}
.msg{font-size:13px;color:var(--ink-muted)}
.err .msg{color:var(--danger)}
.ok{font-size:14px;color:var(--success);align-self:end;padding-bottom:14px}
</style>
<form class="wrap" id="demo-form">
<div class="f"><label for="nome">Seu nome</label><input id="nome" placeholder="Maria Souza"></div>
<div class="f"><label for="emp">Empresa</label><input id="emp" placeholder="Clínica Bem-Estar"></div>
<div class="f err"><label for="wpp">WhatsApp</label><input id="wpp" value="11 9999"><span class="msg">Número incompleto. Use DDD + 9 dígitos.</span></div>
<div class="f"><span class="ok">✓ Recebido. A gente responde ainda hoje.</span></div>
</form>
<script>document.getElementById('demo-form').addEventListener('submit', e => e.preventDefault());</script>
