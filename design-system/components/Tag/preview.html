<!-- @dsCard group="Conteúdo" height=130 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.wrap{padding:24px;display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.tag{font:500 13px/1 var(--font-sans);padding:9px 14px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.tag.on{background:var(--amber-soft);border-color:transparent}
.status{display:inline-flex;gap:8px;align-items:center;font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:var(--radius-pill);border:1px solid var(--line-strong);color:var(--ink)}
.status i{width:7px;height:7px;border-radius:9px;background:var(--success)}
.status i.build{background:var(--amber)}
</style>
<div class="wrap">
<div class="group"><span class="tag on">Todos</span><span class="tag">Saúde</span><span class="tag">Alimentação</span><span class="tag">Serviços</span><span class="tag">Varejo</span></div>
<div class="group"><span class="status"><i></i>Demo ao vivo</span><span class="status"><i class="build"></i>Em construção</span></div>
</div>
