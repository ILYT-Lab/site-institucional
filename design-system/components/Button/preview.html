<!-- @dsCard group="Ações" height=150 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:600 15px/1 var(--font-sans);border-radius:var(--radius-md);padding:16px 22px;border:1px solid transparent;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:transform var(--dur-fast) var(--ease-out),background var(--dur-fast)}
.btn:hover{transform:translateY(-2px)}
.primary{background:var(--amber);color:var(--on-amber)}
.solid{background:var(--ink);color:var(--bg)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.ghost:hover{background:var(--surface-raised)}
.link{background:none;color:var(--ink);padding:16px 4px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line-strong)}
.sm{padding:10px 14px;font-size:14px}
</style>
<div class="wrap">
<button class="btn primary" type="button">Falar no WhatsApp</button>
<button class="btn solid" type="button">Ver portfólio</button>
<button class="btn ghost" type="button">Ver todos os serviços →</button>
<button class="btn link" type="button">Ver demo ao vivo →</button>
<button class="btn ghost sm" type="button">Menu</button>
</div>
